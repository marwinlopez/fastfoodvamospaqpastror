version: '3.3'

services:
  react_native_app:
    build:
      context: ./app
      args:
        - NODE_ENV=development
    environment:
      - NODE_ENV=development
    tty: true
    ports:
      - '19000:19000'
      - '19001:19001'
      - '19002:19002'
    volumes:
      - ./app:/opt/react_native_app/app:delegated
      - ./app/package.json:/opt/react_native_app/package.json
      - ./app/package-lock.json:/opt/react_native_app/package-lock.json
      - notused:/opt/react_native_app/app/node_modules
    healthcheck:
      disable: true

volumes:
  notused: